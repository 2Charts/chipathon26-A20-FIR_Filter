# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "16-bit Programmable Symmetric FIR Filter"
  team: "A20 MisterKebab"
  discord: "2Charts"
  description: "A 16-bit programmable FIR filter with an integrated SPI and UART configuration interface."
  lvs_config: "lvs_config.json"

pins:
  - name: VSS
    io_type: ground

  - name: clk
    io_type: input_cmos

  - name: rst_n
    io_type: input_cmos

  - name: uart_rx
    io_type: input_cmos

  - name: mosi
    io_type: input_cmos

  - name: miso
    io_type: bidirectional_24ma

  - name: sck
    io_type: input_cmos

  - name: cs_n
    io_type: input_cmos

  - name: VDD
    io_type: power